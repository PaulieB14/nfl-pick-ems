<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#141b2d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB612"/>
      <stop offset="100%" style="stop-color:#E59E00"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD466"/>
      <stop offset="50%" style="stop-color:#FFB612"/>
      <stop offset="100%" style="stop-color:#CC9200"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.3"/>
  <!-- Football shape -->
  <ellipse cx="256" cy="256" rx="130" ry="85" transform="rotate(-35 256 256)" fill="url(#shine)" opacity="0.95"/>
  <!-- Football seam (center line) -->
  <line x1="160" y1="310" x2="352" y2="202" stroke="#0a0f1a" stroke-width="6" stroke-linecap="round"/>
  <!-- Football laces -->
  <g stroke="#0a0f1a" stroke-width="5" stroke-linecap="round">
    <line x1="228" y1="232" x2="218" y2="248"/>
    <line x1="244" y1="243" x2="234" y2="259"/>
    <line x1="260" y1="254" x2="250" y2="270"/>
    <line x1="276" y1="265" x2="266" y2="281"/>
  </g>
  <!-- "P" letter accent -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="80" fill="url(#gold)" opacity="0.6">PICKS</text>
</svg>
